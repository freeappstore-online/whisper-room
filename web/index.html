<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <meta name="darkreader-lock" />
    <!-- VitePWA injects the manifest link automatically. If you need a
         static fallback, use: <link rel="manifest" href="/manifest.webmanifest" /> -->
    <script>
      // Set theme + loading background before first paint. Prevents flash.
      // Devs: change the colors below to match your app's brand.
      window.__splashStart = Date.now();
      var d = matchMedia('(prefers-color-scheme: dark)').matches;
      if (d) document.documentElement.dataset.theme = 'dark';
      document.documentElement.style.background = d ? '#000000' : '#ffffff';
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Whisper Room — FreeAppStore</title>
    <!-- Platform analytics loader. CF Web Analytics is auto-provisioned at publish;
         GA4 / Plausible / custom <head> are opt-in via PUT /v1/apps/whisper-room/analytics. -->
    <script src="https://api.freeappstore.online/v1/analytics.js?app=whisper-room" defer></script>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        background: #ffffff;
        transition: opacity 0.45s ease;
      }
      html[data-theme='dark'] #splash { background: #000000; }
      #splash.out { opacity: 0; pointer-events: none; }

      .sp-icon { font-size: 48px; line-height: 1; }
      html[data-theme='dark']  .sp-icon { filter: drop-shadow(0 0 18px rgba(78,255,145,0.35)); }
      html:not([data-theme='dark']) .sp-icon { filter: drop-shadow(0 0 14px rgba(0,122,31,0.25)); }

      .sp-title {
        font-family: Georgia, serif; font-size: 32px; font-weight: 700;
        letter-spacing: -0.04em; margin: 0;
      }
      html[data-theme='dark']  .sp-title { color: #d4f7e4; }
      html:not([data-theme='dark']) .sp-title { color: #0a2010; }

      .sp-sub {
        font-family: monospace; font-size: 12px; letter-spacing: 0.12em;
      }
      html[data-theme='dark']  .sp-sub { color: rgba(78,255,145,0.45); }
      html:not([data-theme='dark']) .sp-sub { color: rgba(0,122,31,0.45); }

      @keyframes sp-blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .sp-cursor { animation: sp-blink 1s step-end infinite; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-icon">📡</div>
      <p class="sp-title">Whisper Room</p>
      <p class="sp-sub">initializing<span class="sp-cursor">_</span></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
